<header class="mx-auto max-w-2xl px-4 pt-32 pb-16">
    <img [ngSrc]="profile.photo.src"
        [width]="profile.photo.width"
        [height]="profile.photo.height"
        [alt]="profile.photo.alt"
        priority
        class="mb-6 size-32 rounded-full object-cover"
    />

    @if (profile.availableForWork){
        <p class="inline-block rounded-full border border-line bg-surface px-3 py-1 text-sm text-ink">
            Disponible para trabajar
        </p>
    }

    <h1 class="mt-2 text-4xl font-semibold text-ink">{{ profile.name }}</h1>
    <p class="mt-2 text-lg text-muted">{{ profile.role }}</p>
    <p class="mt-4 text-muted"> {{ profile.description }}</p>

    <div class="mt-8 flex flex-wrap gap-3">
        <a [href]="'mailto:' + profile.email"
        class="rounded-full bg-accent px-5 py-2 text-sm font-medium text-canvas focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
        >
                Contacto
        </a>
        <a [href]="profile.links.linkedin"
        target="_blank"
        rel="noopener noreferrer"
        class="rounded-full border border-muted px-5 py-2 text-sm text-ink hover:bg-surface focus-visible:outline-offset-2 focus-visible:outline-accent focus-visible:outline-2"
        >
        LinkedIn<span class="sr-only"> (se abre en una pestaña nueva)</span>
        </a>
        <a [href]="profile.links.github"
        target="_blank"
        rel="noopener noreferrer"
        class="rounded-full border border-muted px-5 py-2 text-sm text-ink hover:bg-surface focus-visible:outline-offset-2 focus-visible:outline-accent focus-visible:outline-2"
        >
        GitHub<span class="sr-only"> (se abre en una pestaña nueva)</span>
        </a>
        <a [href]="profile.links.cv"
        download
        class="rounded-full border border-muted px-5 py-2 text-sm text-ink hover:bg-surface focus-visible:outline-offset-2 focus-visible:outline-accent focus-visible:outline-2"
        >
        Descargar CV
        </a>
    </div>
</header>
