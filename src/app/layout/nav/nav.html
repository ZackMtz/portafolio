<nav
  aria-label="Navegación principal"
  class="fixed top-4 left-1/2 z-50 -translate-x-1/2 rounded-full bg-surface/80 p-1 backdrop-blur border border-line"
>
  <ul class="flex gap-1">
    @for (link of links; track link.id) {
      <li>
        <a
          [href]="'#' + link.id"
          [attr.aria-current]="link.id === activeId() ? 'true' : null"
          [class.text-ink]="link.id === activeId()"
          [class.bg-line]="link.id === activeId()"
          [class.text-muted]="link.id !== activeId()"
          class="rounded-full px-3 py-2 text-sm hover:text-ink focus-visible:outline-2 focus-visible:outline-accent"
        >
          {{ link.label }}
        </a>
      </li>
    }
  </ul>
</nav>
